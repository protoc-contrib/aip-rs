name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Check Formatting
        run: nix develop --command cargo fmt --all --check

      - name: Lint
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: nix develop --command cargo test

      # A library is read through its docs: every item documented, every
      # intra-doc link resolving, every example compiling -- the doc tests run
      # with the tests above.
      - name: Check Documentation
        run: nix develop --command cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Authenticate with Crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to Crates.io
        run: nix develop --command cargo publish --package aip-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
